[project]
name = "tpam"
version = "0.1.0"
description = "TPAM — local web app to manage a personal Telegram account (MTProto via Telethon)"
authors = [
    { name = "sh.rakhimov" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=2.8.0",
    "cryptg>=0.6.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.4",
    "ijson>=3.6.0",
    "keyring>=25.7.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.0",
    "telethon>=1.45,<2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tpam = "tpam:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
# E501: long user-facing Russian strings; S311: demo data uses a seeded PRNG on purpose.
ignore = ["RUF001", "RUF002", "RUF003", "S101", "E501", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "ASYNC240"]
# Constant FTS5 DDL (no user input).
"src/tpam/storage/db.py" = ["S608"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["telethon.*", "keyring.*", "ijson.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:telethon.*"]
